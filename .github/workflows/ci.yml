name: Phantom Logos CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "**.md"
      - ".antigravity/**"
      - "docs/**"
      - "scratch/**"
      - "logs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "**.md"
      - ".antigravity/**"
      - "docs/**"
      - "scratch/**"
      - "logs/**"
      - ".gitignore"
      - "LICENSE"
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run ruff check
      run: python -m ruff check src/ cognition/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Create required directories
      run: mkdir -p data
    - name: Run unit tests
      run: |
        pytest tests/ -v -m "not integration and not slow" --timeout=60
      env:
        PYTHONPATH: .
    - name: Coverage report
      run: |
        pytest tests/ --cov=src --cov=cognition --cov-report=term --cov-report=xml --cov-fail-under=30 --timeout=60 -m "not integration and not slow"
      env:
        PYTHONPATH: .
    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
      if: always()

  slow-integration-test:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Create required directories
      run: mkdir -p data
    - name: Run slow and integration tests
      # These tests need a local Ollama server. On a GitHub runner Ollama is not
      # available, so they skip themselves instead of failing the job.
      run: |
        pytest tests/ -v -m "slow or integration" --timeout=120
      env:
        PYTHONPATH: .
